  subtemplate: simple
  sideblockopen: true
  title: Normas de la clase
  description:
  icon: ri-bookmark-fill
  list:
    - title: Si tengo una duda le pregunto al profesor
      description: No a un compañero, no a ChatGPT.
    - title: No usar el móvil en clase a no ser que se especifique.
      description: Si lo usas en clase mientras se está explicando, no se resolverá tu duda.
    - title: No hablar mientras se está explicando
      description: Aprovecha el descanso para hablar, no la clase.
    - title: Confirmarle a Pedro que lo he entendido.
      description: Pedro pregunta mucho si todo se ha entendido, le respondo. Si estoy online pongo un pulgar hacia arriba o hacia abajo.
