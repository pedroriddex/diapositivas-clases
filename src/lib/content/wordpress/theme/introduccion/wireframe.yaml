  title: Fidelidad
  description: "Existe un concepto de fidelidad del diseño que también se aplica en los Wireframes. Lo que acabáis de ver en la imagen anterior es un wireframe denominado como Lo-Fi, es decir: Low Fidelity (baja fidelidad), un boceto sin adornos, sin textos. Pero por otro lado también existe el concepto Hi-Fi, High Fidelity (alta fidelidad), donde se podrían ver los textos y más detalles del apartado del diseño."
