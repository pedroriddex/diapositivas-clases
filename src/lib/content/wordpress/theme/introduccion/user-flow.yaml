  sideblockopen: true
  title: Definir el objetivo
  description: Debemos comprender el negocio de nuestro cliente para poder definir cuál es el objetivo que se desea alcanzar. Puede ser una compra, rellenar un formulario, suscripción, una llamada, agendar una cita, reservar una consultoría...
  icon: ri-number-2
  postDescription: Esto influirá enormemente en el tipo de diseño y las herramientas visuales que usaremos.
