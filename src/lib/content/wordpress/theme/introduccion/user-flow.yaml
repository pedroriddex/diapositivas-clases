- template: text
  subtemplate: simple
  sideblockopen: false
  title: El camino de A -> B
  description: Cuando hablamos del User Flow, nos referimos a una herramienta vital dentro del mundo de la experiencia de usuario (UX), aunque no vamos a tocarlo en profundidad, puesto que ya hay un módulo específico para ello, si tenemos que comprender su funcionamiento.
  icon:
  download: false
  downloadLink:
- template: text
  subtemplate: simple
  sideblockopen: true
  title: Objetivo
  description: El objetivo del User Flow es comprender cómo el usuario interactúa y se mueve por nuestra interfaz, ya sea una web o una aplicación de cualquier tipo. La idea es comprender el punto que debe alcanzar dicho usuario, comenzando desde su entrada a la web (A), hasta la acción que queremos conseguir con la interfaz (B), que puede ir desde comprar, hasta suscribirse.
  icon:
  listItems:
    - num: "1"
      title: Identificar al usuario
      description: Primero debemos comprender al usuario que accede a nuestra interfaz.
    - num: "2"
      title: Definir el objetivo
      description: Cuál es el punto al que el usuario debe llegar. Nuestro punto B.
    - num: "3"
      title: Trazar el camino
      description: Desde el punto de inicio hasta nuestro punto final, cuál es el camino.
  download: false
  downloadLink:
- template: card
  subtemplate: simple
  sideblockopen: true
  title: Identificar al usuario
  description: Debemos comprender en profundidad qué es lo que mueve al usuario. Para ello se usan otras herramientas como el User Persona, que nos ayuda a poner sobre la mesa todos los datos importantes de quien accede a nuestra interfaz.
  icon: ri-number-1
  postDescription: En muchos casos, es el propio cliente quien nos explica en el briefing cuál es su público objetivo, lo cual ya nos facilita esta tarea. Pero si no es así, nos tocaría tratar de estudiar el mercado y el negocio de nuestro cliente para comprender a qué tipo de usuario va dirigido.
