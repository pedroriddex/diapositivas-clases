- template: text
  subtemplate: simple
  sideblockopen: false
  title: Proceso de desarrollo
  description: Conociendo algunos de los tipos de web más clásicos, ahora debemos entender cómo se planea el desarrollo de una página web desde que recibimos el proyecto por parte del cliente, hasta que lanzamos el producto al mercado.
  icon:
  download: false
  downloadLink:
- template: text
  subtemplate: simple
  sideblockopen: false
  title: Proceso de desarrollo
  description: Las decisiones que tomamos en este plan será esencial para comprender la magnitud del proyecto y finalizar con un producto coherente en todos sus aspectos.
  icon:
  listItems:
    - num: "1"
      title: Entender el encargo
      description: Debemos comprender el encargo del cliente en profundidad.
    - num: "2"
      title: Orden y estructura
      description: Ordenar el contenido que el cliente nos proporciona.
    - num: "3"
      title: Bocetar, prototipar y propuesta visual
      description: Crear bocetos sencillos pero claros.
    - num: "4"
      title: Desarrollar, revisar y ajustar
      description: Llevar el diseño a la realidad.
    - num: "5"
      title: Publicar, medir y seguir mejorando
      description: Seguimiento continuo de la web y mejoras. La web está viva.
  download: false
  downloadLink:
- template: card
  subtemplate: simple
  sideblockopen: true
  title: Entender el encargo
  description: "Debemos comprender el encargo del cliente en profundidad, aunque muchas veces el propio cliente tiene dificultades para aterrizar su idea, nuestra tarea inicial es bajar a tierra esa idea y convertirla en un plan sólido. Para ello debemos comprender cual es el público al que va destinado el producto y el objetivo del mismo. Por ejemplo, el objetivo de un e-commerce es: vender."
  icon:
  postDescription: Para esto se suele utilizar un documento llamado briefing, donde el cliente rellena preguntas claves que nos ayudarán a asentar las bases del proyecto.
  mgContent:
  mgCode:
  mgLogo:
  mgTitle:
  mgUrl:
  mgUrlTitle:
  mgListType: bullet
  mgIconListSpace: false
  mgIconListSeparator: false
- template: card
  subtemplate: simple
  sideblockopen: true
  title: Orden y estructura
  description: Como segundo paso, debemos ordenar el contenido que el cliente nos proporcione y planear una estructura para el mismo. Cómo vamos a dividir el contenido, cómo vamos a organizarlo en la web. Para esto se suelen utilizar herramientas de UX, de las cuales hablaremos más adelante.
  icon:
  postDescription:
  mgContent:
  mgCode:
  mgLogo:
  mgTitle:
  mgUrl:
  mgUrlTitle:
  mgListType: bullet
  mgIconListSpace: false
  mgIconListSeparator: false
- template: card
  subtemplate: simple
  sideblockopen: true
  title: Bocetar, prototipar y propuesta visual
  description: A partir de aquí, comienza nuestra tarea de trabajar en el apartado visual. Creando bocetos sencillos pero claros, donde podamos centrarnos en la estructura de cada sección dentro de la web, cada apartado, pestaña. Estableciendo qué vamos a mostrar en cada lugar.
  icon:
  postDescription:
  mgContent:
  mgCode:
  mgLogo:
  mgTitle:
  mgUrl:
  mgUrlTitle:
  mgListType: bullet
  mgIconListSpace: false
  mgIconListSeparator: false
- template: card
  subtemplate: simple
  sideblockopen: true
  title: Bocetar, prototipar y propuesta visual
  description: Esto abre la puerta al prototipado. Pasando de un boceto sencillo a un diseño completo e interactivo que presentaremos nuestro cliente para una primera revisión visual.
  icon:
  postDescription: Para esta tarea, la herramienta por excelencia es Figma, con la cual trabajaremos en clase y conoceremos en profundidad.
  mgContent:
  mgCode:
  mgLogo:
  mgTitle:
  mgUrl:
  mgUrlTitle:
  mgListType: bullet
  mgIconListSpace: false
  mgIconListSeparator: false
- template: card
  subtemplate: simple
  sideblockopen: true
  title: Desarrollar, revisar y ajustar
  description: Con un diseño claro, la aprobación del cliente, y ya frente a nuestro lienzo web. Nos tocaría trabajar en lo que denominamos como “la maquetación”. De forma resumida, una tarea en la que llevaremos el diseño a la realidad, realizando el mismo prototipo desarrollado en el apartado anterior, en una web completa.
  icon:
  postDescription:
  mgContent:
  mgCode:
  mgLogo:
  mgTitle:
  mgUrl:
  mgUrlTitle:
  mgListType: bullet
  mgIconListSpace: false
  mgIconListSeparator: false
- template: card
  subtemplate: simple
  sideblockopen: true
  title: Desarrollar, revisar y ajustar
  description: Este punto tiende a estar lleno de revisiones, cambios y ajustes propuestos por el cliente. Es el paso en el que la web se lanza al mercado y se abre a los usuarios, por lo que es vital.
  icon:
  postDescription: Para este punto, nosotros usaremos WordPress, pero hay diversas formas de desarrollar una página web.
  mgContent:
  mgCode:
  mgLogo:
  mgTitle:
  mgUrl:
  mgUrlTitle:
  mgListType: bullet
  mgIconListSpace: false
  mgIconListSeparator: false
- template: card
  subtemplate: simple
  sideblockopen: true
  title: Publicar, medir y seguir mejorando
  description: Lanzamos la web. Si, pero esto no termina aquí. Nuestro trabajo aún está lejos de terminar, puesto que lo que hemos hecho debe ser medido con herramientas que nos permitan ver el flujo de navegación del usuario. Si hay cuello de botella, si debemos mejorar o facilitar algún proceso. Retocamos, mejoramos y repetimos.
  icon:
  postDescription: Es un proceso continuo que nunca termina.
  mgContent:
