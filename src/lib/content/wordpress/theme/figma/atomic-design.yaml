- template: text
  subtemplate: simple
  sideblockopen: true
  title: Plantillas
  description: En el momento en el que comenzamos a unir organismos para dar forma a las distintas páginas de nuestro diseño, a esto se le denomina “plantilla”, y es el penúltimo paso del proceso de diseño atómico. Es importante entender que no es necesario que estas plantillas tengan las imágenes finales ni los textos reales.
  icon: ri-number-4
  download: false
  downloadLink:
- template: text
  subtemplate: simple
  sideblockopen: true
  title: Páginas
  description: Ahora con las plantillas hechas, nuestra misión va a ser rellenar todo con el contenido real. Textos, imágenes, cualquier cosa. De esta forma conseguimos el diseño final de nuestra interfaz.
