- template: text
  subtemplate: simple
  sideblockopen:
  icon: ri-functions
  title: Las funciones
  description: >-
    Una función es un bloque de código que podemos declarar y ejecutar en cualquier momento. Te propongo una situación: no es lo mismo decir 've a comprar el pan' donde das una orden directa que debe ejecutarse en el momento, a decir 'cuando te avise ve a comprar el pan'. En el segundo ejemplo declaras una orden que puedes ejecutar en cualquier momento cuando digas 'ahora'.

- template: text
  subtemplate: simple
  sideblockopen:
  icon: ri-functions
  title: Las funciones
  description: >-
    Además, lo bueno de las funciones es que puedes reutilizarlas en cualquier momento, entre otras cosas. Por lo que podemos declarar una función una vez y ejecutarla la cantidad de veces que deseemos.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: Cómo se declara
  description: >-
    Para declarar una función nombrada utilizaremos la palabra reservada 'function' seguida del nombre de la función y los paréntesis '()'.
  mgCode: javascript
  mgContent: >-
    ```js

    function nombreFuncion() {
      // código
    }

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: Cómo se declara
  description: >-
    Es importante entender que los paréntesis '()' son necesarios juto después del nombre de la función. Piensa en un método de objeto como 'console.log()', donde siempre se ponen los paréntesis donde añadimos un argumento.
  mgCode: javascript
  mgContent: >-
    ```js

    function nombreFuncion() {
      // código
    }

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: Cómo se declara
  description: >-
    Es importante entender que los paréntesis '()' son necesarios juto después del nombre de la función. Piensa en un método de objeto como 'console.log()', donde siempre se ponen los paréntesis donde añadimos un argumento.
  mgCode: javascript
  mgContent: >-
    ```js

    function nombreFuncion() {
      // código
    }

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: Cómo se invoca
  description: >-
    Invocar una función significa ejecutarla. Para invocar una función nombrada utilizaremos el nombre de la función seguida de los paréntesis '()'.
  mgCode: javascript
  mgContent: >-
    ```js

    function nombreFuncion() {
      // código
    }

    nombreFuncion();

  postDescription: >-
    De esta forma la función se ejecutará y realizará las acciones que se encuentren dentro de ella.

- template: text
  subtemplate: simple
  sideblockopen:
  icon:
  title: Return
  description: >-
    ¿Te has preguntado en algún momento para sirven los paréntesis '()' de la declaración de una función? ¿Cómo podemos frenar la ejecución de una función? Estas preguntas tienen una respuesta que se llama 'return'.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: Return
  description: >-
    Lo primero que debes entender es que 'return' es una palabra reservada que se utiliza para devolver un valor de una función. Lo cual pronto lo entenderás, pero aún más básico que esto es que 'return' detiene la ejecución de una función.
  mgCode: javascript
  mgContent: >-
    ```js

    function nombreFuncion() {
      console.log('hola');
      return;
      console.log('adios');
    }

    nombreFuncion();
  postDescription: >-
    En este ejemplo, solo se mostrará en consola 'hola' ya que 'return' detiene la ejecución de la función y obliga al navegador a saltar la siguiente línea fuera de la función.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: Return
  description: >-
    Pero ahora viene lo más interesante, 'return' también puede devolver un valor.
  mgCode: javascript
  mgContent: >-
    ```js

    function nombreFuncion(a, b) {
      return a + b;
    }

    console.log(nombreFuncion(1, 2));
  postDescription: >-
    En este ejemplo, la función devolverá el valor de 'a + b' que es 3. Esto nos permite crear funciones flexibles que pueden recibir argumentos y devolver valores.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: Return
  description: >-
    Estos parámetros contendran lo que se denomina como 'parámetros', son como variables que se declaran dentro de la función y que le damos un valor desde la invocación de la función utilizando el argumento.
  mgCode: javascript
  mgContent: >-
    ```js

    function nombreFuncion(nombre, edad) {
      console.log(`mi nombre es ${nombre} y tengo ${edad} años`);
    }

    nombreFuncion('Pedro', 29); // mi nombre es Pedro y tengo 29 años
  postDescription: >-
    Cada vez que invocamos la función, le damos un valor a los parámetros que se declaran dentro de la función.

