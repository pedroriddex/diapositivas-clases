  sideblockopen:
  icon: 
  title: "Bueno, pero... ¿Qué es el DOM?"
  description: >-
    El Document Object Model (DOM) es una representación en forma de árbol de la estructura de un documento HTML. Cada elemento HTML es un nodo en este árbol, y puedes acceder y manipular estos nodos con JavaScript.

