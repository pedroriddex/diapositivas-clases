- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: "El objeto 'document'"
  description: >-
    Habiendo accedido al objeto 'document' se abre un puente entre JavaScript y el HTML, permitiéndote manipular y cambiar dinámicamente el contenido de la página.
  mgCode: javascript
  mgContent: >-
    ```js
    
    document.getElementById('miElemento'); // Acceder al elemento con id 'miElemento'
    
- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: "El objeto 'document'"
  description: >-
    Lo más habitual es guardar estos elementos dentro de una variable para poder manipularlos más tarde.
  mgCode: javascript
  mgContent: >-
    ```js
    
    const miElemento = document.getElementById('miElemento'); // Acceder al elemento con id 'miElemento'

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: "El objeto 'document'"
  description: >-
    Existen otras maneras de seleccionar un elemento HTML, no solo por la ID, siempre dependerá de las necesidades que tengamos durante el desarrollo.
  mgCode: javascript
  mgContent: >-
    ```js
    
    const miElementoID = document.getElementById('miElemento'); 
    
    // Devuelve el primer elemento con esa ID


    const miElementoAny = document.querySelector('.miClase'); 
    
    // Devuelve el primer elemento que coinsida con el argumento: clase, ID, etiqueta...


    const misElementosAny = document.querySelectorAll('.miClase'); 
    
    // Devuelve todos los elementos con esa clase en una NodeList.


    const misElementosTag = document.getElementsByTagName('p'); 
    
    // Devuelve todos los elementos con la etiqueta <p> en una HTMLCollection.


    const misElementosClass = document.getElementsByClassName('miClase'); 
    
    // Devuelve todos los elementos con esa clase en una HTMLCollection.

