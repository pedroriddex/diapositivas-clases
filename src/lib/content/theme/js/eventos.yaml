- template: text
  subtemplate: simple
  sideblockopen: 
  icon: 
  title: Qué es un evento
  description: >-
    Un evento es una interacción del usuario con la página web, como hacer clic en un botón, rellenar un campo de formulario, etc.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: addEventListener
  description: >-
    Veamos como comenzar a trabajar con eventos. Para ello necesitamos un elemento HTML que deba escuchar elemento, y acto seguido utilizaremos el método 'addEventListener' para escuchar el evento.
  mgCode: javascript
  mgContent: >-
    ```js
    
    const btn = document.querySelector('button');

    btn.addEventListener()

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: addEventListener
  description: >-
    Ahora debemos indicarle en el argumento de 'addEventListener' dos cosas: el tipo de evento y la función que se ejecutará cuando el evento ocurra.
  mgCode: javascript
  mgContent: >-
    ```js
    
    const btn = document.querySelector('button');

    btn.addEventListener('click', () => {
      console.log('hola');
    });
  postDescription: >-
    Para hacer mucho más simple la sintaxis de 'addEventListener' podemos utilizar una función arrow, lo que la hace más compacta. Ojo, debes fijarte muy bien en que la función se encuentra dentro del argumento de 'addEventListener'.

