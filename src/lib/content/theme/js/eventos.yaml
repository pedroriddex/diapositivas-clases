- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: Objeto evento
  description: >-
    Cuando un evento es activado, el navegador crea un objeto evento que contiene información sobre el evento, por ejemplo: el objeto que lo activa, la posición del cursor, etc.
  mgCode: javascript
  mgContent: >-
    ```js
    
    const btn = document.querySelector('button');

    btn.addEventListener('click', (e) => {
      console.log(e);
    });
  postDescription: >-
    Para cargar ese objeto debemos pasar como argumento la función 'e' que es el objeto evento. Al recibirlo podemos acceder a sus propiedades y métodos.
    