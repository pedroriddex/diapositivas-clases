- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: Unshift
  description: >-
    El método 'unshift' nos permite agregar uno o más elementos al principio de una array.
  mgCode: javascript
  mgContent: >-
    ````
    
    let miArray = ['⚽️', '🏀', '🏐'];


    miArray.unshift('🎾');

    miArray // ['🎾', '⚽️', '🏀', '🏐']
  
- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: Push
  description: >-
    Con el método 'push' podemos agregar uno o más elementos al final de una array.
  mgCode: javascript
  mgContent: >-
    ````
    
    let miArray = ['⚽️', '🏀', '🏐'];


    miArray.push('🎾');

    miArray // ['⚽️', '🏀', '🏐', '🎾']

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: Splice
  description: >-
    Con el método 'splice' podemos eliminar uno o más elementos de una array, y opcionalmente, agregar nuevos elementos en su lugar. Lo cual requiere de tres parámetros: el índice desde el cual comenzar a eliminar elementos, el número de elementos a eliminar y los elementos a agregar en su lugar.
  mgCode: javascript
  mgContent: >-
    ````
    
    let miArray = ['⚽️', '🏀', '🏐'];


    miArray.splice(1, 2, '🎾');

    miArray // ['⚽️', '🎾']

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: IndexOf
  description: >-
    Este método nos permite buscar un elemento en una array y devolver su índice. Si el elemento no se encuentra, devuelve -1.
  mgCode: javascript
  mgContent: >-
    ````
    
    let miArray = ['⚽️', '🏀', '🏐'];


    miArray.indexOf('🏐'); // 2

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: Reverse
  description: >-
    Con reverse podemos invertir el orden de los elementos de una array.
  mgCode: javascript
  mgContent: >-
    ````
    
    let miArray = ['⚽️', '🏀', '🏐'];


    miArray.reverse();

    miArray // ['🏐', '🏀', '⚽️']

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: Join
  description: >-
    Con join podemos unir todos los elementos de una array en una cadena de texto. Por defecto, se unen con una coma, pero podemos especificar otro separador.
  mgCode: javascript
  mgContent: >-
    ````
    
    let miArray = ['⚽️', '🏀', '🏐'];


    miArray.join(); // '⚽️,🏀,🏐'

    miArray.join(' - '); // '⚽️ - 🏀 - 🏐'

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: ForEach
  description: >-
    ForEach es uno de los métodos más importantes para recorrer una array y ejecutar una función en cada elemento. Como ya sabemos: las arrays se pueden recorrer. Es decir, podemos ejecutar una acción por cada valor de la array.
  mgCode: javascript
  mgContent: >-
    ````
    
    let miArray = ['⚽️', '🏀', '🏐'];


    miArray.forEach((elemento) => {
      console.log(elemento);
    });

  postDescription: >-
    En el ejemplo anterior, hemos utilizado una función flecha para ejecutar la acción, y como parámetro de la función flecha, hemos utilizado la variable 'elemento', que representa cada uno de los elementos de la array, pero este parámetro puedes llamarlo como prefieras. Por ejemplo: Pepe.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: ForEach
  description: >-
    Si también queremos acceder al índice de cada elemento, podemos utilizar el segundo parámetro de la función flecha.
  mgCode: javascript
  mgContent: >-
    ````
    
    let miArray = ['⚽️', '🏀', '🏐'];


    miArray.forEach((elemento, indice) => {
      console.log(elemento, indice);
    });

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: Map
  description: >-
    Map es otro método muy útil para recorrer una array y ejecutar una función en cada elemento. La diferencia con forEach es que map devuelve una nueva array con los resultados de la función ejecutada en cada elemento.
  mgCode: javascript
  mgContent: >-
    ````
    
    let miArray = ['⚽️', '🏀', '🏐'];


    let miArray2 = miArray.map((elemento) => {
      return elemento + ' 🏆';
    });

    miArray2 // ['⚽️ 🏆', '🏀 🏆', '🏐 🏆']

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: Map
  description: >-
    Más allá de modificar los elementos de una array, map también puede ser utilizado para convertir una array en otra. Por ejemplo, si tenemos una array con objetos que equivalen a estudiantes, podríamos generar una nueva array que solo guarde el nombre de los estudiantes.
  mgCode: javascript
  mgContent: >-
    ````
    
    let estudiantes = [
      { nombre: 'Pepe', edad: 20 },
      { nombre: 'Luis', edad: 22 },
      { nombre: 'Ana', edad: 21 },
    ];


    let estudiantesNombres = estudiantes.map((estudiante) => estudiante.nombre );

    estudiantesNombres // ['Pepe', 'Luis', 'Ana']
  postDescription: >-
    Ahora no solo tenemos una array con toda la información de los estudiantes, sino que también tenemos una array con solo los nombres de los estudiantes gracias a map.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: Find
  description: >-
    Con find podemos buscar un elemento en una array y devolverlo. Si el elemento no se encuentra, devuelve undefined.
  mgCode: javascript
  mgContent: >-
    ````
    
    let miArray = ['⚽️ ', '🏀 🏆', '🏐'];


    miArray.find((elemento) => elemento.includes('🏆')) // '🏀 🏆'

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: Some
  description: >-
    Some actua de manera similar a find, pero en lugar de devolver el primer elemento que cumple la condición, devuelve true si al menos un elemento cumple la condición, y false si ninguno lo hace.
  mgCode: javascript
  mgContent: >-
    ````
    
    let miArray = ['⚽️ ', '🏀 🏆', '🏐'];


    miArray.some((elemento) => elemento.includes('🏆')) // true

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: Filter
  description: >-
    Con filter podemos crear una nueva array con todos los elementos que cumplan una condición.
  mgCode: javascript
  mgContent: >-
    ````
    
    let miArray = ['⚽️ ', '🏀 🏆', '🏐🏆'];


    miArray.filter((elemento) => elemento.includes('🏆')) // ['🏀 🏆', '🏐🏆']
  postDescription: >-
    Esto sería útil si por ejemplo queremos almacenar en una nueva array solo los alumnos que tienen menos de 3 faltas.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: Filter
  description: >-
    En lugar de buscar por include, en este caso haríamos una comparación del valor de faltas para ver si es menor que 3.
  mgCode: javascript
  mgContent: >-
    ````
    
    let alumnos = [ 
      { nombre: 'Pepe', faltas: 2 },
      { nombre: 'Luis', faltas: 3 },
      { nombre: 'Ana', faltas: 1 },
    ];


    alumnos.filter((alumno) => alumno.faltas < 3) // [{ nombre: 'Pepe', faltas: 2 }, { nombre: 'Ana', faltas: 1 }]

- template: card
  subtemplate: simple
  sideblockopen: 
  icon: # Clase de Remix Icons.
  title: Deconstrucción
  description: >-
    La deconstrucción es una forma de extraer valores de una array o un objeto en variables separadas, no se trata de un método en sí, sino una sintacis especial de JavaSciprt, muy útil sobre todo en React y otros frameworks modernos. Veamos cómo funciona.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: # Clase de Remix Icons.
  title: Deconstrucción
  description: >-
    Primero entendamos para qué sirve una deconstrucción. Imagina que quieres almacenar por algún motivo los valores que se encuentran dentro de una array en diferentes variables.
  mgCode: javascript
  mgContent: >-
    ````
    
    let miArray = ['⚽️ ', '🏀 ', '🏐'];


    let futbol = miArray[0];

    let baloncesto = miArray[1];

    let tenis = miArray[2];
  postDescription: >-
    Seguramente, si le das unas vueltas, lo que se te ocurriría sería algo así. Pero con la deconstrucción, podemos hacer exactamente eso en una sola línea de código.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: # Clase de Remix Icons.
  title: Deconstrucción
  description: >-
    Añadiendo como nombre de la variable envuelto en corchetes los nombres en orden de cada valor, automáticamente se almacenará en cada variable el valor correspondiente.
  mgCode: javascript
  mgContent: >-
    ````
    
    let miArray = ['⚽️ ', '🏀 ', '🏐'];


    let [futbol, baloncesto, tenis] = miArray;
    

    
