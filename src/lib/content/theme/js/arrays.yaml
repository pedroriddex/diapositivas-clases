- template: card
  subtemplate: simple
  sideblockopen: 
  icon: ri-list-ordered-2
  title: Lo que ya sabemos
  description: >-
    Como hemos visto, las arrays son un tipo de dato que nos permite almacenar un conjunto de valores.
  mgCode: javascript
  mgContent: >-
    ````
    
    let miArray = [1, 2, 3, 4, 5];

- template: card
  subtemplate: simple
  sideblockopen: 
  icon: ri-list-ordered-2
  title: Lo que ya sabemos
  description: >-
    También hemos visto que para acceder a un valor concreto de una array solo debemos indicarle la posición del valor entre corchetes. Siempre partiendo desde el primer elemento, con el índice 0.
  mgCode: javascript
  mgContent: >-
    ````
    
    let miArray = [1, 2, 3, 4, 5];

    miArray[0] // 1

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: Propiedad 'length'
  description: >-
    Con 'length' podemos obtener la longitud de la array, es decir, el número de elementos que contiene.
  mgCode: javascript
  mgContent: >-
    ````
    
    let miArray = [1, 2, 3, 4, 5];

    miArray.length // 5
  postDescription: >-
    Es importante tener en cuenta que la propiedad 'length' nos devuelve el número de elementos de la array, no el índice del último elemento. Por lo tanto, para acceder al último elemento de la array, debemos usar el índice 'length - 1'.

