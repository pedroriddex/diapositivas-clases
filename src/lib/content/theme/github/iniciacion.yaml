- template: image
  subtemplate: simple
  sideblockopen: 
  icon: ri-git-branch-fill
  title: ¿Qué es Git?
  description: >-
    Git es el sistema de control de versiones más popular del mundo. Permite a los desarrolladores guardar, recuperar y compartir versiones de su proyecto. Cada cambio realizado en el proyecto se registra como un 'commit', lo que permite a los desarrolladores revertir cambios si es necesario sin perder su proyecto. Es como una súper copia de seguridad de tu trabajo.
  iframe: interactive

