- template: text
  subtemplate: simple
  sideblockopen: 
  icon: ri-git-branch-fill
  title: ¿Qué es Git?
  description: >-
    Antes de meternos de cabeza en el mundo de GitHub, es necesario entender lo que es Git.

- template: image
  subtemplate: simple
  sideblockopen: 
  icon: ri-git-branch-fill
  title: ¿Qué es Git?
  description: >-
    Git es el sistema de control de versiones más popular del mundo. Permite a los desarrolladores guardar, recuperar y compartir versiones de su proyecto. Cada cambio realizado en el proyecto se registra como un 'commit', lo que permite a los desarrolladores revertir cambios si es necesario sin perder su proyecto. Es como una súper copia de seguridad de tu trabajo.
  iframe: interactive

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: ri-github-fill
  title: Github
  description: >-
    GitHub es una plataforma en la nube que permite a los desarrolladores almacenar, compartir y colaborar en proyectos de software. Proporciona herramientas para gestionar el código fuente, realizar seguimiento de cambios, colaborar con otros desarrolladores y más.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: ri-github-fill
  title: GitHub
  description: >-
    Para empezar a utilizarlo primero debemos crearnos una cuenta en la página oficial de GitHub.
  mgLogo: logo
  mgUrl: https://github.com/
  mgUrlTitle: GitHub
  mgTitle: GitHub · Change is constant. GitHub keeps you ahead. · GitHub
  mgContent: >-
    From your first line of code to final deployment, GitHub provides AI and automation tools to help you build and ship better software faster. A Copilot chat ...

- template: image
  subtemplate: simple
  sideblockopen: true
  icon: ri-github-fill
  title: GitHub
  description: >-
    Una vez entremos en nuestra cuenta de GitHub tendremos que crear un repositorio. Imagina el repositorio como una carpeta en la nube donde guardaremos nuestro proyecto.
  image: repositorio

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: Preparar nuestros archivos
  description: >-
    Primero debemos convertir nuestra carpeta en un repositorio Git. Para ello, abrimos la terminal en la carpeta y ejecutamos:
  mgCode: bash
  mgContent: >-
    ````

    git init
  postDescription: >-
    Esto creará una carpeta oculta llamada '.git' en tu carpeta. Esta carpeta contiene toda la información necesaria para rastrear los cambios en tu proyecto. Como dato importante, debemos usar el comando 'cd' para entrar en la carpeta.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: # Clase de Remix Icons.
  title: Añadir nuestros archivos
  description: >-
    Ahora debemos añadir nuestros archivos al repositorio. Para ello, ejecutamos:
  mgCode: bash
  mgContent: >-
    ````
    
    git add .
  postDescription: >-
    Esto añadirá todos los archivos en la carpeta al repositorio. Si queremos añadir solo algunos archivos, podemos especificar su nombre, pero con el '.' al final lo que hacemos es añadir todo el contenido de la carpeta.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: 
  title: Crear nuestro primer commit
  description: >-
    Sabrás lo que es un commit más adelante, pero por ahora, debemos crear nuestro primer commit. Para ello, ejecutamos:
  mgCode: bash
  mgContent: >-
    ````

    git commit -m "Primer commit"

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: # Clase de Remix Icons.
  title: Conectar con GitHub
  description: >-
    Ahora debemos conectar nuestro repositorio local con el repositorio remoto en GitHub. Para ello, ejecutamos:
  mgCode: bash
  mgContent: >-
    ````
    
    git remote add origin https://github.com/<tu-usuario>/<tu-repositorio>.git
  postDescription: >-
    Esto conectará tu repositorio local con el repositorio remoto en GitHub. Ahora puedes subir tus cambios a GitHub ejecutando 'git push origin main'.