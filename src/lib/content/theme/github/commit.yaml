- template: text
  subtemplate: simple
  sideblockopen: 
  icon: ri-git-commit-fill
  title: ¿Qué es un commit?
  description: >-
    Un commit es una instantánea de los cambios realizados en el repositorio. Cada vez que realizamos un cambio en el proyecto, lo registramos como un commit. Esto nos permite rastrear el historial de cambios y revertir a versiones anteriores si es necesario. Imagina el historial de navegación de tu navegador, cuando abres una web se te guarda en el historial y puedes encontrarla rápidamente y volver a abrir dicha página. Un commit funciona de manera similar.
  
