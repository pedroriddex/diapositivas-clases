  subtemplate: simple
  sideblockopen: true
  icon: # Clase de Remix Icons.
  title: Carganto el JSON
  description: >-
    Si tenemos el archivo .json en nuestros archivos locales o incluso en un servidor, podemos cargarlo en JavaScript listo para usar con el método fetch que aprenderás en el tema correspondiente.
