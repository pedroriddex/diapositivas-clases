- template: card
  subtemplate: simple
  sideblockopen: true
  title: Funciones nombradas
  description: Son las que acabamos de ver como ejemplo. Se declaran con el nombre de la función y los paréntesis '()' utilizando la palabra reservada 'function'.
  icon:
  postDescription:
  mgContent: |-
    ```js
    function nombreFuncion() {
      // código
    }
  mgCode: javascript
  mgLogo:
  mgTitle:
  mgUrl:
  mgUrlTitle:
  mgListType: bullet
  mgIconListSpace: false
  mgIconListSeparator: false
- template: card
  subtemplate: simple
  sideblockopen: true
  title: Funciones anónimas
  description: Son funciones donde no tienen nombre y se declaran en una variable o como argumento de otra función. Lo cual es muy util para crear funciones de un solo uso.
  icon:
  postDescription:
  mgContent: |-
    ```js
    const nombreFuncion = function() {
      // código
    }
  mgCode: javascript
  mgLogo:
  mgTitle:
  mgUrl:
  mgUrlTitle:
  mgListType: bullet
  mgIconListSpace: false
  mgIconListSeparator: false
- template: card
  subtemplate: simple
  sideblockopen: true
  title: Funciones arrow
  description: Son funciones que se declaran en una variable o argumento de otra función y que utilizan la sintaxis de flecha '=>', lo cual las convierte en funciones más cortas y fáciles de leer. Un detalle interesante es que si no usamos más de un parámetro, podemos omitir los paréntesis '()'.
  icon:
  postDescription:
  mgContent: |-
    ```js
    const nombreFuncion = () => {
      // código
    }
  mgCode: javascript
  mgLogo:
  mgTitle:
  mgUrl:
  mgUrlTitle:
  mgListType: bullet
  mgIconListSpace: false
  mgIconListSeparator: false
- template: card
  subtemplate: simple
  sideblockopen: true
  title: Funciones generadoras
  description: Son funciones que utilizan la palabra reservada 'function*' y que pueden pausar su ejecución utilizando la palabra reservada 'yield'. Aunque son más complejas, cada vez están más en desuso.
  icon:
  postDescription: Estas variables se almacenan en una variable y se invocan con el nombre de la variable seguida de los paréntesis '()'. Se puede ir saltando de una pausa a otra utilizando la palabra reservada 'next'.
  mgContent: |-
    ```js
    function* nombreFuncion() {
      // código
      yield;
      // código
      yield;
      // código
      return;
    }
  mgCode: javascript
  mgLogo:
  mgTitle:
  mgUrl:
  mgUrlTitle:
  mgListType: bullet
  mgIconListSpace: false
  mgIconListSeparator: false
- template: card
  subtemplate: simple
  sideblockopen: true
  title: Funciones IIFE
  description: Son funciones que se invocan inmediatamente después de su declaración. Lo cual es muy util para crear funciones de un solo uso.
  icon:
  postDescription: Pueden ser complejas por su sintaxis, pero son muy útiles para crear funciones de un solo uso. Van envueltas en paréntesis '()' para que se interpreten como una expresión y no como una declaración. Los paréntesis '()' al final invocan la función.
  mgContent: |-
    ```js
    (function() {
      // código
    })();
  mgCode: javascript
  mgLogo:
  mgTitle:
  mgUrl:
  mgUrlTitle:
  mgListType: bullet
  mgIconListSpace: false
  mgIconListSeparator: false
