  title: Las funciones
  description: "Una función es un bloque de código que podemos declarar y ejecutar en cualquier momento. Te propongo una situación: no es lo mismo decir 've a comprar el pan' donde das una orden directa que debe ejecutarse en el momento, a decir 'cuando te avise ve a comprar el pan'. En el segundo ejemplo declaras una orden que puedes ejecutar en cualquier momento cuando digas 'ahora'."
