- template: card
  subtemplate: simple
  sideblockopen: true
  title: Cómo se invoca
  description: Invocar una función significa ejecutarla. Para invocar una función nombrada utilizaremos el nombre de la función seguida de los paréntesis '()'.
  icon:
  postDescription: De esta forma la función se ejecutará y realizará las acciones que se encuentren dentro de ella.
  mgContent: |-
    ```js
    function nombreFuncion() {
      // código
    }
    nombreFuncion();
  mgCode: javascript
  mgLogo:
