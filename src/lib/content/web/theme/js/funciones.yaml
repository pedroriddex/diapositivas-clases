- template: text
  subtemplate: simple
  sideblockopen:
  title: Return
  description: ¿Te has preguntado en algún momento para sirven los paréntesis '()' de la declaración de una función? ¿Cómo podemos frenar la ejecución de una función? Estas preguntas tienen una respuesta que se llama 'return'.
  icon:
  download: false
  downloadLink:
- template: card
  subtemplate: simple
  sideblockopen: true
  title: Return
  description: Lo primero que debes entender es que 'return' es una palabra reservada que se utiliza para devolver un valor de una función. Lo cual pronto lo entenderás, pero aún más básico que esto es que 'return' detiene la ejecución de una función.
  icon:
  postDescription: En este ejemplo, solo se mostrará en consola 'hola' ya que 'return' detiene la ejecución de la función y obliga al navegador a saltar la siguiente línea fuera de la función.
  mgContent: |-
    ```js
    function nombreFuncion() {
      console.log('hola');
      return;
      console.log('adios');
    }
    nombreFuncion();
  mgCode: javascript
  mgLogo:
  mgTitle:
  mgUrl:
  mgUrlTitle:
  mgListType: bullet
  mgIconListSpace: false
  mgIconListSeparator: false
- template: card
  subtemplate: simple
  sideblockopen: true
  title: Return
  description: Pero ahora viene lo más interesante, 'return' también puede devolver un valor.
  icon:
  postDescription: En este ejemplo, la función devolverá el valor de 'a + b' que es 3. Esto nos permite crear funciones flexibles que pueden recibir argumentos y devolver valores.
  mgContent: |-
    ```js
    function nombreFuncion(a, b) {
      return a + b;
    }
    console.log(nombreFuncion(1, 2));
  mgCode: javascript
  mgLogo:
  mgTitle:
  mgUrl:
  mgUrlTitle:
  mgListType: bullet
  mgIconListSpace: false
  mgIconListSeparator: false
- template: card
  subtemplate: simple
  sideblockopen: true
  title: Return
  description: Estos parámetros contendran lo que se denomina como 'parámetros', son como variables que se declaran dentro de la función y que le damos un valor desde la invocación de la función utilizando el argumento.
  icon:
  postDescription: Cada vez que invocamos la función, le damos un valor a los parámetros que se declaran dentro de la función.
  mgContent: |-
    ```js
    function nombreFuncion(nombre, edad) {
      console.log(`mi nombre es ${nombre} y tengo ${edad} años`);
    }
    nombreFuncion('Pedro', 29); // mi nombre es Pedro y tengo 29 años
  mgCode: javascript
  mgLogo:
  mgTitle:
  mgUrl:
  mgUrlTitle:
  mgListType: bullet
  mgIconListSpace: false
  mgIconListSeparator: false
