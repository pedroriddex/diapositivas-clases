  sideblockopen: true
  icon:
  title: 'Array'
  description: >-
    Si te preguntas para qué serviría una array, volviendo a la tienda online, el carrito sería una array que contendría objetos, cada uno representando un producto en el carrito.
  mgCode: javascript
