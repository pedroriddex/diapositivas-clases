- template: text
  subtemplate: simple
  sideblockopen:
  icon: ri-box-3-line
  title: 'Objeto'
  description: >-
    Los datos de tipo objeto son contenedores inteligentes que almacenan no solo valores, sino también comportamientos organizados bajo un mismo techo conceptual. Como ya hemos visto en clase muchas veces, y he sido muy pesado con ello: los objetos tienen propiedades y métodos.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'Objeto'
  description: >-
    Creamos un objeto utilizando las llaves `{}` y asignamos propiedades y métodos a través de pares clave-valor.
  mgCode: javascript
  mgContent: >-
    ```js

    const miObjeto = {
      clave: valor;
    };

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'Objeto'
  description: >-
    Un objeto es una entidad que contiene propiedades y métodos. Se genera dentro de una variable y se accede a sus propiedades y métodos mediante la notación de puntos.
  mgCode: javascript
  mgContent: >-
    ```js

    const alumno = {
      nombre: 'Juan',
      edad: 30,
      saludar: function() {
        console.log('¡Hola!');
      }
    };

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'Objeto'
  description: >-
    Un objeto es una entidad que contiene propiedades y métodos. Se genera dentro de una variable y se accede a sus propiedades y métodos mediante la notación de puntos.
  mgCode: javascript
  mgContent: >-
    ```js

    const alumno = {
      nombre: 'Juan',
      edad: 30,
      saludar: function() {
        console.log('¡Hola!');
      }
    };

    alumno.nombre; // Juan

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'Objeto'
  description: >-
    Si te preguntas para qué serviría un objeto, imagínate un carrito de una tienda online. Cada producto en el carrito es un objeto, que contiene propiedades como el nombre, el precio y la cantidad.
  list:
    - title: 'nombre'
    - title: 'precio'
    - title: 'cantidad'
  postDescription: >-

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'Objeto'
  description: >-
    Podemos cambiar el valor de una propiedad de un objeto accediendo a ella mediante la notación de puntos y asignando un nuevo valor, tal como haríamos en una variable.
  mgCode: javascript
  mgContent: >-
    ```js

    let alumno = {
      nombre: 'Juan',
      edad: 30,
      saludar: function() {
        console.log('¡Hola!');
      }
    };

    alumno.nombre = 'Sofía';

- template: text
  subtemplate: simple
  sideblockopen:
  icon: ri-list-ordered-2
  title: 'Array'
  description: >-
    Los datos de tipo array son contenedores inteligentes que almacenan no solo valores, sino también comportamientos. Aunque muy similares a los objetos, los arrays se utilizan principalmente para almacenar colecciones de datos ordenados y acceder a ellos mediante índices numéricos en lugar de claves.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'Array'
  description: >-
    Un array es una entidad que contiene propiedades y métodos. Se genera dentro de una variable y se accede a sus propiedades y métodos mediante la notación de corchetes '[]'.
  mgCode: javascript
  mgContent: >-
    ```js

    const miArray = [1, 2, 3, 4, 5];

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: Array
  description: >-
    No solo podemos añadir números a una array, sino también strings, booleanos, objetos, funciones, etc.
  mgCode: javascript
  mgContent: >-
    ```js

    const miArray = ['Juan', 'María', 'Pedro', 'Ana', 'Luis'];

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: Array
  description: >-
    Para acceder a estos valores no utilizamos la notación de puntos, sino la notación de corchetes, ya que los arrays utilizan índices numéricos para acceder a sus elementos.
  mgCode: javascript
  mgContent: >-
    ```js

    const miArray = ['Juan', 'María', 'Pedro', 'Ana', 'Luis'];
    miArray[0]; // Juan

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: Array
  description: >-
    Las arrays pueden ser modificadas añadiendo, eliminando o cambiando elementos con métodos como push(), pop(), shift(), unshift(), splice(), slice(), etc.
  mgCode: javascript
  mgContent: >-
    ```js

    const miArray = ['Juan', 'María', 'Pedro', 'Ana', 'Luis', 'Marcos'];

    miArray.push('Marcos'); // Añade 'Marcos' al final del array
  postDescription: >-
    Pero hablaremos de esto en el apartado correspondiente de las arrays

