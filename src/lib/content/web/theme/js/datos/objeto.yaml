- template: text
  subtemplate: simple
  sideblockopen:
  icon: ri-functions
  title: 'Función'
  description: >-
    Ya hemos visto las funciones, pero ahora veremos como agregarla como un dato en una variable, array, objeto, etc.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'Función'
  description: >-
    Para ello vamos a aprender a realizar un tipo de función llamada "función anónima".
  mgCode: javascript
  mgContent: >-
    ```js

    const miFuncion = function() {
      console.log('¡Hola!');
    };

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'Función'
  description: >-
    Para ello vamos a aprender a realizar un tipo de función llamada "función anónima".
  mgCode: javascript
  mgContent: >-
    ```js

    const miFuncion = function() {
      console.log('¡Hola!');
    };
  postDescription: >-
    ¿Por qué se llama anónima? Porque no tiene nombre. Habitualmente cuando creamos una función siempre le añadimos el nombre para ejecutarla. En este caso el nombre se asigna a la variable 'miFuncion'.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'Función'
  description: >-
    Ahora vamos a ver como ejecutar una función anónima.
  mgCode: javascript
  mgContent: >-
    ```js

    miFuncion(); // ¡Hola!
  postDescription: >-
    Como ves, como nombre usaríamos el nombre de la propia variable 'miFuncion'.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'Función'
  description: >-
    Pero existe una forma más limpia y eficiente de generar una función, la cual se denomina "función flecha".
  mgCode: javascript
  mgContent: >-
    ```js

    const miFuncion = () => {
      console.log('¡Hola!');
    };
  postDescription: >-
    Es más rápida y más concisa. Al añadir los paréntesis, se evita el uso de la palabra clave 'function' y se simplifica la sintaxis, pero requiere esa forma de flecha '=>' justo antes de abrir las llaves.

- template: text
  subtemplate: simple
  sideblockopen:
  icon: ri-calendar-line
  title: 'Date'
  description: >-
    El objeto Date en JavaScript se utiliza para trabajar con fechas y horas.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'Date'
  description: >-

  mgCode: javascript
  mgContent: >-
    ```js

    const hoy = new Date();
    console.log(hoy); // Imprime la fecha y hora actual
  postDescription: >-
    El objeto Date se crea con la palabra clave 'new' seguida de la palabra 'Date'. Esto crea una nueva instancia del objeto Date, representando la fecha y hora actual.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'Date'
  description: >-
    Tenemos métodos que nos permiten acceder a valores específicos dentro de la fecha.
  mgCode: javascript
  mgContent: >-
    ```js

    const hoy = new Date();


    console.log(hoy.getFullYear()); // Imprime el año actual

    console.log(hoy.getMonth()); // Imprime el mes actual (0-11)

    console.log(hoy.getDate()); // Imprime el día del mes actual

    console.log(hoy.getHours()); // Imprime las horas actuales

    console.log(hoy.getMinutes()); // Imprime los minutos actuales

    console.log(hoy.getSeconds()); // Imprime los segundos actuales

- template: text
  subtemplate: simple
  sideblockopen:
  icon:
  title: 'RegExp'
  description: >-
    El objeto RegExp en JavaScript se utiliza para hacer una búsqueda de patrones en cadenas de texto, por ejemplo para seleccionar todas las palabras de un string que empiecen por una letra mayúscula.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'RegExp'
  description: >-
    Se guarda el patron en una variable la expresion que se va a utilizar para buscar en el string.
  mgCode: javascript
  mgContent: >-
    ```js

    const patron = /[a-z]/g;
  postDescription: >-
    Aunque la forma en la que se escribe no es muy intuitiva, voy a intentar explicar cada detalle.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'RegExp'
  description: >-
    Se escribe entre barras diagonales '/' el patrón que se va a buscar. Por ejemplo si quiero verificar si el usuario ha introducido un arroba en su correo electrónico, el patrón sería '/@/'.
  mgCode: javascript
  mgContent: >-
    ```js

    const patron = /@/;

    const correo = 'usuario@example.com';

    console.log(patron.test(correo)); // true
  postDescription: >-
    El método 'test()' verifica si el patrón se encuentra en la cadena de texto. En este caso, devuelve 'true' porque el arroba '@' está presente en la cadena 'correo'.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'RegExp'
  description: >-
    Ahora bien, si quiero detectar por ejemplo si el usuario ha añadido también un punto, por ejemplo para poner '.com', debemos concatenar varias búsquedas, vamos a ir paso a paso
  mgCode: javascript
  mgContent: >-
    ```js

    const patron = /@./;
  postDescription: >-
    Añadimos un '.' justo después del arroba, pero cuidado, este punto es lo que se conoce como un 'metacaracter', imagínalo como el '*' de CSS, que busca cualquier cosa. En este caso se añade para detectar que después del arroba hay más carácteres. por ejemplo '@profesorado'.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'RegExp'
  description: >-
    Ahora bien, si quiero detectar por ejemplo si el usuario ha añadido también un punto, por ejemplo para poner '.com', debemos concatenar varias búsquedas, vamos a ir paso a paso
  mgCode: javascript
  mgContent: >-
    ```js

    const patron = /@.*/;
  postDescription: >-
    Ahora añadimos un '*' justo después del punto, que también es un metacaracter, pero este lo que hace es buscar la cantidad de carácteres del caracter anterior, en este caso el caracter anterior es 'cualquier caracter después del arroba'. En resumen, estamos diciéndole: "Oye, busca que haya un arroba, y después de él, cualquier cantidad de carácteres".

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'RegExp'
  description: >-
    Ahora bien, si quiero detectar por ejemplo si el usuario ha añadido también un punto, por ejemplo para poner '.com', debemos concatenar varias búsquedas, vamos a ir paso a paso
  mgCode: javascript
  mgContent: >-
    ```js

    const patron = /@.*\./;
  postDescription: >-
    Como hemos visto que el punto '.' es un metacaracter, para detectar el punto literal, debemos escaparlo con una barra invertida '\'. Esto quiere decir que para que JavaScript entienda que lo que busco es literalmente un punto en el texto, debemos escribir '\.', si no lo hiciéramos, pensaría que estamos buscando cualquier caracter nuevamente.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'RegExp'
  description: >-
    Ahora bien, si quiero detectar por ejemplo si el usuario ha añadido también un punto, por ejemplo para poner '.com', debemos concatenar varias búsquedas, vamos a ir paso a paso
  mgCode: javascript
  mgContent: >-
    ```js

    const patron = /@.*\./;

    const correo = 'usuario@example.com';

    console.log(patron.test(correo)); // true
  postDescription: >-
    De esta forma verificamos si el correo está completo y tiene el formato correcto.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'RegExp'
  description: >-
    Existen muchas posibilidades de utilizar expresiones regulares, por ejemplo para validar un número de teléfono, una dirección de correo electrónico, una contraseña, etc. Además, se pueden utilizar para reemplazar partes de una cadena de texto, dividir una cadena en partes. En resumen, RegExp es una poderosa herramienta para trabajar con cadenas de texto en JavaScript.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'RegExp'
  description: >-
    Si te preguntas para qué serviría un RegExp. Imagínate el búscador de palabras del navegador o de una aplicación como Word, donde puedes buscar una palabra específica en un texto largo. En ese caso, podrías utilizar una expresión regular para buscar todas las ocurrencias de esa palabra en el texto.

- template: text
  subtemplate: simple
  sideblockopen:
  icon: ri-map-pin-line
  title: 'Map'
  description: >-
    Un Map es otra manera de almacenar datos en JavaScript, similar a un objeto, pero con una sintaxis diferente. En lugar de utilizar propiedades y valores, un Map utiliza pares clave-valor que pueden ser cualquier tipo de dato, incluyendo objetos, funciones, y más.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'Map'
  description: >-
    Se genera de manera similar a un dato de tipo Date, y puede generarse vacio o con valores iniciales.
  mgCode: javascript
  mgContent: >-
    ```js

    const map = new Map();

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'Map'
  description: >-
    Ahora, podemos agregar elementos al Map utilizando el método 'set()', que recibe dos argumentos: la clave y el valor, que repito, puede ser cualquier tipo de dato.
  mgCode: javascript
  mgContent: >-
    ```js

    const map = new Map();

    map.set('nombre', 'Pedro');
  postDescription: >-
    Como puedes ver, se parece mucho a lo que sería un objeto, donde pondríamos 'nombre: 'Pedro''

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'Map'
  description: >-
    Podemos llamar a elementos dentro de un Map utilizando el método 'get()', que recibe como argumento la clave del elemento que queremos obtener.
  mgCode: javascript
  mgContent: >-
    ```js

    const map = new Map();

    map.set('nombre', 'Pedro');
    console.log(map.get('nombre')); // 'Pedro'
  postDescription: >-
    ¿Qué pasaría si quisiera que mi clave en lugar de ser un string, fuera un número? Por ejemplo como ocurre en una array.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'Map'
  description: >-
    Podemos darle cualquier tipo de dato como clave, no solo strings, lo cual es muy flexible para muchos casos.
  mgCode: javascript
  mgContent: >-
    ```js

    const map = new Map();

    map.set(123, 'Pedro');
    console.log(map.get(123)); // 'Pedro'

- template: text
  subtemplate: simple
  sideblockopen:
  icon: ri-checkbox-line
  title: 'Set'
  description: >-
    Igual que los anteriores, Set permite almacenar datos, pero en vez de claves y valores, solo valores. Además, hace algo muy especial con estos valores.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'Set'
  description: >-
    Se genera de manera similar a un dato de tipo Date o Map, y puede generarse vacio o con valores iniciales.
  mgCode: javascript
  mgContent: >-
    ```js

    const set = new Set();

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'Set'
  description: >-
    Para agregar elementos a un Set, utilizamos el método 'add()', que recibe como argumento el valor que queremos agregar.
  mgCode: javascript
  mgContent: >-
    ```js

    const set = new Set();

    set.add('Lucía');

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'Set'
  description: >-
    Lo interesante de Set es que no permite agregar valores duplicados. Si intentamos agregar un valor que ya existe en el Set, no se hará nada.
  mgCode: javascript
  mgContent: >-
    ```js

    const set = new Set();


    set.add('Lucía');

    set.add('Lucía');

    console.log(set); // Set(1) {'Lucía'}
  postDescription: >-
    Como puedes ver, solo se agrega una vez, ignorando el duplicado. Esto no ocurriría así en una array.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon:
  title: 'Set'
  description: >-
    Imagínate que tienes las entradas de una fiesta y no quieres que una persona con una agreditación se duplique en la lista. En ese caso, podrías utilizar un Set para almacenar el número de acreditado de las personas que entraron.
  mgCode: javascript
  mgContent: >-
    ```js

    const set = new Set();


    set.add('01');

    set.add('02');

    set.add('03');

  postDescription: >-
    Si en algún momento se intenta repetir uno de estos numeros, no funcionaría, ya que Set impide la duplicación de valores.
