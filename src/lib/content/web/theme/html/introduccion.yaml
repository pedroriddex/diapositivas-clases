- template: card
  subtemplate: simple
  sideblockopen: true
  title: Contenido de la etiqueta
  description: A esto se le denomina apertura de etiqueta, y a partir de esta apertura se agregaría lo que se denomina como el contenido de la etiqueta. Por ejemplo, en el caso de un título el contenido sería el texto que contiene dicho título.
  icon:
  postDescription:
  mgContent: |-
    ```html
    <etiqueta> Contenido de mi etiqueta
    ```
  mgCode: html
  mgLogo:
  mgTitle:
  mgUrl:
  mgUrlTitle:
  mgListType: bullet
  mgIconListSpace: false
  mgIconListSeparator: false
- template: card
  subtemplate: simple
  sideblockopen: true
  title: Cierre de etiqueta
  description: Una vez terminamos de agregar el contenido es necesario agregar el “cierre” de la etiqueta para poder dar lugar a la creación de próximas etiquetas de otro tipo. Se escribe la misma etiqueta pero esta vez agregando un “slash” justo antes del nombre.
  icon:
  postDescription:
  mgContent: |-
    ```html
    <etiqueta> Contenido de mi etiqueta </etiqueta>
    ```
  mgCode: html
  mgLogo:
  mgTitle:
  mgUrl:
  mgUrlTitle:
  mgListType: bullet
  mgIconListSpace: false
  mgIconListSeparator: false
- template: card
  subtemplate: simple
  sideblockopen: true
  title: Atributos
  description: Las etiquetas en muchas ocaciones pueden tener atributos extras que nos e pueden agregar desde el contenido, sino que debemos agregarlos dentro de la apertura como un atributo con un valor designado.
  icon:
  postDescription:
  mgContent: |-
    ```html
    <etiqueta atributo="valor"> Contenido de mi etiqueta </etiqueta>
    ```
  mgCode: html
  mgLogo:
  mgTitle:
  mgUrl:
  mgUrlTitle:
  mgListType: bullet
  mgIconListSpace: false
  mgIconListSeparator: false
- template: card
  subtemplate: simple
  sideblockopen: true
  title: Etiquetas sin cierre
  description: Hay otros casos en los que la etiqueta en cuestión no tiene un contenido escrito como tal, como puede ser el caso de una imagen. En estos casos no es requerido un cierre de la etiqueta ya que todos los valores irán dados desde los atributos.
  icon:
  postDescription:
  mgContent: |-
    ```html
    <img src="mi_imagen.png">
    ```
  mgCode: html
