  title: Etiquetas HTML
  description: Lo primero que debemos entender es que HTML se compone de etiquetas, y cada etiqueta tiene una función diferente. Estas etiquetas se escriben siempre entre los símbolos “menor que” y “mayor que”, y a partir de esta apertura se agregaría lo que se denomina como el contenido de la etiqueta. Por ejemplo, en el caso de un título el contenido sería el texto que contiene dicho título. Una vez terminamos de agregar el contenido es necesario agregar el “cierre” de la etiqueta para poder dar lugar a la creación de próximas etiquetas de otro tipo. Se escribe la misma etiqueta pero esta vez agregando un “slash” justo antes del nombre.
  icon:
