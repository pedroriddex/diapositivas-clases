- template: image
  subtemplate: simple
  sideblockopen:
  title: ¿Añadir elementos externos?
  description: Un iframe es un elemento que nos permite abrir una "ventana" hacia otro sitio web. Permitiéndonos ver contenido de otro sitio dentro del nuestro propio. Un ejemplo de esto sería un mapa de Google Maps.
  icon:
  image:
  iframe: map
- template: card
  subtemplate: simple
  sideblockopen: true
  title: Mucho más de lo que parece
  description: "Un iframe puede hacer más de lo que parece. Podemos incrustar otra web completa en esa ventana y darle el tamaño que queramos. Tenemos el control total de la ventana que generamos, pero ojo: no podemos acceder a sus elementos ni modificar sus estilos."
