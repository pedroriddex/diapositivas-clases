- template: card
  subtemplate: simple
  sideblockopen: true
  title: ¿Cómo funciona?
  description: Aunque es cierto que habitualmente copiaremos y pegaremos el código de iframe en nuestra web, es importante entender cómo se construye.
  icon:
  postDescription:
  mgContent: |-
    ```html
    <iframe></iframe>
    ```
