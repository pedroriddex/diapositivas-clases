- template: card
  subtemplate: simple
  sideblockopen: true
  title: Guia del alumn@
  description: >-
    Es uno de los documentos más importantes para los estudiantes de la escuela, contiene toda la información necesaria para que comprendas cómo funciona la escuela y las normas. Es vital que lo leas y comprendas.

- template: card
  subtemplate: simple
  sideblockopen: true
  title: Manual de la asignatura
  description: >-
    Es el documento que que contiene todo el material de la asignatura, el que deberás estudiar para comprender el tema, aunque todo se dará en clase es otra forma de tener el contenido.

- template: card
  subtemplate: simple
  sideblockopen: true
  title: Programa académico
  description: >-
    Si tienes dudas sobre lo que se verá en el módulo en ambitos generales, puedes consultar el programa académico para ver un índice general de lo que vas a estudiar.

- template: card
  subtemplate: simple
  sideblockopen: true
  title: Sistema de evaluación
  description: >-
    Toda la información sobre cómo funciona el sistema de evaluación de la escuela se encuentra en este módulo. Si es la primera vez que estudias en CEI es recomendable que lo leas.

- template: image
  subtemplate: simple
  sideblockopen: true
  icon: ri-gemini-fill
  title: NotebookLM
  description: >-
    NotebookLM es una herramienta de IA integrada en el Classroom, que te ayudará a resolver tus dudas y a aprender de manera más eficiente.
  image: classroom3

- template: card
  subtemplate: simple
  sideblockopen: false
  icon: ri-bookmark-fill
  title: Clases
  description: >-
    Hablemos sobre cómo funcionarán las clases en este módulo.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: ri-bookmark-fill
  title: Clases - En el aula
  description: >-
  list:
    - title: Aprovechad las 3 horas
    - title: Podéis traer vuestros propios portátiles
    - title: Descanso de 10 minutos (15 minutos como máximo)

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: ri-bookmark-fill
  title: Clases - Durante las clases
  description: >-
  list:
    - title: Normalmente será teórica + práctica de la teoría (katas)
    - title: Los primero días serán mas teóricas
    - title: A mitad de Asignatura más prácticas
  postDescription: >-
    Si tenéis libre os recomendaría en casa practicar los ejercicios o terminarlos si nos quedamos a medias.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: ri-bookmark-fill
  title: Clases - Ejercicios
  description: >-
    En las clases trabajaremos varias topologías de ejercicios:
  list:
    - title: Katas
    - title: Proyectos

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: ri-bookmark-fill
  title: Clases - Katas
  description: >-
  list:
    - title: Ejercicios cortos para practicar la sintaxis
    - title: No es importante acabar rápido sino escribir bien
    - title: Si nos equivocamos, borramos esa línea y comenzamos de nuevo

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: ri-bookmark-fill
  title: Clases - Proyectos
  description: >-
  list:
    - title: Son webs / aplicaciones completas que trabajamos poco a poco
    - title: Se irán completando a lo largo de la asignatura

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: ri-bookmark-fill
  title: Clases - Ejercicios
  description: >-
    Cuando hagas una práctica te recomiendo que:
  list:
    - title: Como normal general no copies línea a línea desde una captura de pantalla o desde otro ejercicio
    - title: La primera vez puedes ver y mirar código de una captura u otro ejericicio
    - title: Repite el ejercicio hasta que puedas hacerlo prácticamente sin mirar
    - title: Apúntate dónde fallas porque los fallos se repiten

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: ri-bookmark-fill
  title: Clases - Asistencia y horario
  list:
    - title: Si por algún motivo tenéis que faltar a clase escribir directamente a coordinacion@cei.es
    - title: La cámara es obligatoria siempre cuando estamos online, si por algún casual no podéis conectarla escribir directamente a coordinacion@cei.es
    - title: Los días festivos de clase son los días del calendario donde se imparta presencialmente la clase, ejemplo. Si la clase se imparte en Valencia, el calendario de festivos es el de Valencia.

- template: card
  subtemplate: simple
  sideblockopen: true
  icon: ri-bookmark-fill
  title: Clases - Contenido asíncrono
  description: >-
    Son ejercicios que debéis de intentar resolver “sin ayuda”, es decir con lo aprendido en clase pero se pueden preguntar dudas del contenido asíncrono en clase.
  list:
    - title: El contenido teórico se aprenderá en clase
    - title: El contenido práctico se comenzará a trabajar en clase
    - title: La revisión de éstos se realizará sólo durante la asignatura, no al acabar
    - title: Se entregan antes del final de Asignatura

